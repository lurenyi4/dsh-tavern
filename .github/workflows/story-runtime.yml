name: Story Runtime core
on:
  push:
    paths: ['world-runtime/**', 'config/cli-runtime/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/story-runtime.yml']
  pull_request:
    paths: ['world-runtime/**', 'config/cli-runtime/**', 'pnpm-lock.yaml', 'package.json', '.github/workflows/story-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run install:world-runtime
      - run: npm run test:world
      - run: node --test world-runtime/test/e2e-api.mjs world-runtime/test/e2e-dom.mjs
# This job is Linux + actual app DOM, not a Chromium or four-platform acceptance claim.
